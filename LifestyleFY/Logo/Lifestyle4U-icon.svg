<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 34 360 360" width="100%" height="100%">
  <defs>
    <!-- Background Glow Gradient -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f5e9" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f7fa" />
    </linearGradient>
    
    <!-- Drop Shadow for the Badge -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    
    <!-- Utensil Gradients -->
    <linearGradient id="forkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b381a" />
      <stop offset="100%" stop-color="#43a047" />
    </linearGradient>
    <linearGradient id="armGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b5e20" />
      <stop offset="100%" stop-color="#66bb6a" />
    </linearGradient>
    <linearGradient id="spoonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e7d32" />
      <stop offset="100%" stop-color="#81c784" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" fill="#fafafa" />

  <!-- Outer Circle Badge with Shadow -->
  <circle cx="250" cy="210" r="140" fill="url(#bgGlow)" filter="url(#dropShadow)" />
  
  <!-- Inner White Stroke -->
  <circle cx="250" cy="210" r="133" fill="none" stroke="#ffffff" stroke-width="12" />

  <!-- Barcode (Bottom section of badge) -->
  <g fill="#0b381a">
    <rect x="175" y="240" width="4" height="40" />
    <rect x="182" y="240" width="2" height="48" />
    <rect x="187" y="240" width="5" height="35" />
    <rect x="195" y="240" width="3" height="42" />
    <rect x="201" y="240" width="6" height="38" />
    <rect x="210" y="240" width="2" height="45" />
    <rect x="215" y="240" width="4" height="35" />
    <rect x="222" y="235" width="3" height="55" />
    <rect x="228" y="240" width="5" height="40" />
    <rect x="236" y="240" width="2" height="46" />
    <rect x="241" y="240" width="6" height="35" />
    <rect x="250" y="230" width="4" height="60" />
    <rect x="257" y="240" width="3" height="40" />
    <rect x="263" y="240" width="5" height="48" />
    <rect x="271" y="240" width="2" height="35" />
    <rect x="276" y="240" width="6" height="42" />
    <rect x="285" y="240" width="4" height="38" />
    <rect x="292" y="240" width="2" height="45" />
    <rect x="297" y="240" width="5" height="35" />
    <rect x="305" y="240" width="3" height="50" />
    <rect x="311" y="240" width="5" height="40" />
    <rect x="319" y="240" width="2" height="35" />
  </g>

  <!-- Line Chart / Growth Lines -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M 215 215 L 250 180 L 275 200 L 315 140" fill="none" stroke="#a5d6a7" stroke-width="6" />
    <path d="M 225 225 L 255 190 L 280 210 L 320 150" fill="none" stroke="#4caf50" stroke-width="3" />
  </g>

  <!-- Chart Background Semi-transparent Pillars -->
  <path d="M 250 180 L 250 235" fill="none" stroke="#b2dfdb" stroke-width="12" opacity="0.6" />
  <path d="M 275 200 L 275 235" fill="none" stroke="#80cbc4" stroke-width="12" opacity="0.5" />
  <path d="M 315 140 L 315 235" fill="none" stroke="#4db6ac" stroke-width="16" opacity="0.4" />
  <path d="M 320 150 L 320 235" fill="none" stroke="#009688" stroke-width="12" opacity="0.2" />

  <!-- Sparkle / Star Icon -->
  <path d="M 320 115 Q 320 125 310 125 Q 320 125 320 135 Q 320 125 330 125 Q 320 125 320 115" fill="#4caf50" />
  <circle cx="308" cy="117" r="1.5" fill="#81c784" />
  <circle cx="332" cy="133" r="1.5" fill="#81c784" />

  <!-- Dumbbell -->
  <path d="M 140.2 216.3 L 163.8 167.7" fill="none" stroke="url(#armGrad)" stroke-width="8" stroke-linecap="round" />
  <path d="M 129.4 211.0 L 150.9 221.5" fill="none" stroke="url(#armGrad)" stroke-width="10" stroke-linecap="round" />
  <path d="M 153.1 162.5 L 174.6 173.0" fill="none" stroke="url(#armGrad)" stroke-width="10" stroke-linecap="round" />

  <!-- Stylized Spoon -->
  <path d="M 185 245 C 195 190, 240 170, 260 135" fill="none" stroke="url(#spoonGrad)" stroke-width="10" stroke-linecap="round" />
  <ellipse cx="266" cy="125" rx="14" ry="22" transform="rotate(35 266 125)" fill="url(#spoonGrad)" />

  <!-- Stylized Fork (straight) -->
  <path d="M 160.0 245.0 L 214.4 133.5" fill="none" stroke="url(#forkGrad)" stroke-width="12" stroke-linecap="round" />

  <!-- Fork Tines Base -->
  <path d="M 200.9 127.0 L 227.8 140.1" fill="none" stroke="url(#forkGrad)" stroke-width="10" stroke-linecap="round" />

  <!-- Fork Individual Tines -->
  <path d="M 200.9 127.0 L 217.5 92.8" fill="none" stroke="url(#forkGrad)" stroke-width="4" stroke-linecap="round" />
  <path d="M 209.9 131.4 L 226.5 97.2" fill="none" stroke="url(#forkGrad)" stroke-width="4" stroke-linecap="round" />
  <path d="M 218.9 135.7 L 235.5 101.6" fill="none" stroke="url(#forkGrad)" stroke-width="4" stroke-linecap="round" />
  <path d="M 227.8 140.1 L 244.5 106.0" fill="none" stroke="url(#forkGrad)" stroke-width="4" stroke-linecap="round" />
  <!-- Sweeping leaf-like element overlay to merge handles -->
  <path d="M 182 222 C 192 196, 212 183, 222 162" fill="none" stroke="#2e7d32" stroke-width="6" stroke-linecap="round" />

  <!-- Typography -->
</svg>
